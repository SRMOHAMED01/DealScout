# ============================================================
# ci.yml — Pipeline CI/CD (Palier H)
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealscout
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: dealscout_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealscout -d dealscout_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ingestion/requirements.txt
          pip install -r scoring_engine/requirements.txt
          pip install -r ml/requirements.txt
          pip install pytest pytest-cov ruff

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
        working-directory: ./frontend

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Python (ruff)
        run: ruff check backend/ ingestion/ scoring_engine/ ml/ orchestration/ tests/ || true

      - name: Lint SQL (sqlfluff)
        run: |
          pip install sqlfluff
          sqlfluff lint dbt_project/models/ || true

      - name: Lint frontend (eslint)
        working-directory: ./frontend
        run: npx eslint src --ext .js,.jsx || true

      - name: Run backend tests
        run: python -m pytest tests/ -v --cov=backend --cov=ingestion --cov=scoring_engine --cov=ml -x

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealscout
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: dealscout_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealscout -d dealscout_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-postgres

      - name: dbt deps
        working-directory: ./dbt_project
        run: dbt deps

      - name: dbt build (run + test)
        working-directory: ./dbt_project
        env:
          DBT_PROD_HOST: localhost
          DBT_PROD_USER: dealscout
          DBT_PROD_PASSWORD: changeme
          DBT_PROD_DBNAME: dealscout_db
        run: dbt build --target prod

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker-compose -f docker-compose.yml build

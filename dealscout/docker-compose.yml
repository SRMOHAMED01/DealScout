# ============================================================
# docker-compose.yml — Orchestration complète DealScout (Palier H)
# ============================================================

version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dealscout-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - dealscout-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dealscout-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - dealscout-net

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: dealscout-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.example
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dealscout}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - dealscout-net

  postgres:
    image: postgres:16-alpine
    container_name: dealscout-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dealscout
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: dealscout_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dealscout-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealscout-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://dealscout:changeme@postgres:5432/dealscout_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - kafka
      - minio
    networks:
      - dealscout-net

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: dealscout-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - dealscout-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: dealscout-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - dealscout-net

networks:
  dealscout-net:
    driver: bridge

volumes:
  minio_data:
  pg_data:
  grafana_data:
